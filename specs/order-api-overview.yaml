              example: 
                errors:
                - errorCode: TI-API-00404
                  type: ResourceNotFound
                  section: Path
                  reason: "Resource could not be found"
                  message: "Delivery Cost not found for 'DOESNOTEXIST'."
        '405':
          description: >-
            Method Not Allowed.
          content:
            application/json:
