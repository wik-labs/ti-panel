          type: object
          properties:
            type: 
              type: string
              description: The payment type used. This could be 'TI Line of Credit' or '3rd Party Line of Credit' or 'Bank Transfer'.
            method: 
              type: string
              description: The payment method used. For example with '3rd Party Line of Credit' this would be 'Apruve'.
            bankTranferApproverEmail:
              type: string
              description: The email for bank transfer payment that requires an admin email for order approval. This information was provided in the checkout profile ID setup.
            details:
                type: object
                properties:
                  beneficiary:
                    type: string
                    description: Company name to whom the wire is being sent.
                    example: Texas Instruments Incorporated.
                  bankRoutingAndTransitNumber:
                    type: string
                    description: An ABA number used for wires and electronic automatic clearing house (ACH) transactions such as electronic funds transfer.
                    example : 031100209
                  swiftCode:
                    type: string
                    description: SWIFT (Society for Worldwide Interbank Financial Telecommunications) code is an 8-11 character long, standard format code that identifies banks and financial institutions worldwide. 
                    example: CITIUS33DEL
                  bankAddress:
                    type: string
                    description: Bank address of the beneficiary's bank that is going to receive the funds.
                    example: Citibank, N.A., One Penn's Way New Castle DE 19720.
                  accountNumber:
                    type: string
                    description: The account number in the beneficiary bank that is going to receive the funds. This account number would be specified in the pro-form invoice.
                    example: 7256000000032. 
                  correspondentBankAccount:
