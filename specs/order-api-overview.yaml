components:
  schemas:
    orderCreate:
      type: object
      properties:
        order:
          type: object
          required:
          - checkoutProfileId
          - lineItems
          properties:
            checkoutProfileId: 
              type: string
              description: Customer's checkout profile Id. Available in your myTI customer portal. This is a mandatory field. 
            customerPurchaseOrderNumber: 
              type: string
              description: Customer's purchase order number if applicable. This is a optional field.
            expediteShipping:
              type: boolean
              description: True or False flag to request expedite shipping for TI Shipping options. If true expedited shipping will be used when available. If false economy shipping will be used. Default is False.
            endCustomerCompanyName: 
              type: string
              description: Customer's end customer company name where these materials will be used. This is an optional field.
            customerOrderComments: 
              type: array
              items:
                type: object
                properties:
                  message: 
                    type: string
                    maxLength: 60
                    description: Customer pass-through text. The text will be passed back in the response as is.   
            lineItems:
              type: array
              items:
                type: object
                required:
                - tiPartNumber
                - quantity
                properties:
                  customerLineItemNumber: 
                    type: string
                    description: Line item number supplied by customer. This is a optional field.
                  tiPartNumber: 
                    type: string
                    maxLength: 25
                    description: TI orderable part number. This is a required field.
                  customerPartNumber: 
                    type: string
                    maxLength: 25
                    description: Customer provided orderable part number. This is a optional field.
                  customReelIndicator: 
                    type: boolean
                    description: Boolean flag of true or false to request Custom Reel. Default is false.
                  quantity: 
                    type: integer
                    description: Customer's requested quantity. This is a required field.    
                  customerItemComments: 
                    type: array
                    items:
                      type: object
                      properties:
                        message: 
                          type: string
                          maxLength: 60
                          description: Customer pass-through text. The text will be passed back in the response as is.    
    orderCreateResponse:
      type: object
      properties:
        orderNumber:
          type: string
          description: The unique identifier generated for this order request. This order number should be used for any future references.
        cartId:
          type : string
          description: The unique cartID generated for this order request. This cartId number is useful for troubleshooting errors during order creation.
        checkoutProfileId: 
          type: string
          description: Customer's checkout profile Id used to create the order. This is available in your myTI customer portal.
        currencyCode: 
          type: string
          description: Currency ISO code used for this order. For example, for US order it will be USD.
        orderDate:
          type: string
          description: The date when the order was created. Format for date is yyyy-MM-dd'T'HH:mm:ss'Z'
        orderEntry:
          type: string
          description: The channel through which this order was created. Possible values are API, EDI, TI.com, RPA.
        customerPurchaseOrderNumber:
          type: string
          description: Customer's purchase order number if available. This is an optional field.
        orderStatus:
          type: string
          description: Supplier status of order. Possible values are Processing, Acceptance Required, Created, Submitted, Cancelled, In-Work, Complete.
        orderedBy:
          type: string
          description: The name of the company that this order was placed by.
        endCustomerCompanyName: 
          type: string
          description: Customer's end customer company name where these materials will be used. This information will be available if this was provided in your request.
        application:
          type: string
          description: The name of the application where the materials in the order will be used. This information was provided in your checkout profile setup in myTI.
        endEquipment:
          type: string
          description: The name of the end equipment where the materials in the order will be used. This information was provided in your checkout profile setup in myTI.
        intendedForMilitary:
          type: boolean
          description: Boolean flag of true or false as to whether the materials in the order will be used for any military end use. This was specified in your checkout profile setup in myTI.
        isProductionOrder:
          type: boolean
          description: Boolean flag of true or false. If the order was created using the Test API end point, this value will be false. If the order was created by the Production API, this value will be true.
        totalOrderSummary: 
          type: object
          properties:
            subTotal: 
              type: number
              format: double
              description: Subtotal for the order.
            estimatedDiscountAmount: 
              type: number
              format: double
              description: The amount of the discounts if applicable that were applied to this order 
            estimatedShippingCost: 
              type: number
              format: double
              description: The total shipping cost that was calculated for this order.
            estimatedInventoryTransferFee:
              type: number
              format: double
              description: Additional inventory transfer fee (if applicable) to accommodate your order to ship from a United States location
            estimatedTaxes: 
              type: number
              format: double
              description: The total estimated taxes that were calculated for this order. 
            orderTotal: 
              type: number
              format: double
              description: Total cost of the order including the taxes and shipping costs, and deducting any discounts or coupons.
        discounts: 
          type: array
          items:
            type: object
            properties:
              type: 
                type: string
                description: The name of the discount that was applied. For example, custom reel discount.
              amount: 
                type: number
                format: double
                description: The amount for the discount that was applied.
        lineItems:
          type: array
          items:
            type: object
            properties:
              tiLineItemNumber:
                type: string
                description: Line item number generated by Supplier.
              customerLineItemNumber: 
                type: string
                description: Line item number supplied by Customer.
              tiPartNumber:
                type: string
                description: TI Part Number that was used for creating the order. You can find more details by visiting www.ti.com         
              customerPartNumber:
                type: string
                description: Customer provided Part Number.
              tiPartDescription:
                type: string
                description: The short description for this product. You can find more details by visiting ti.com, going to the specific product page, and checking the description section.
              partType:
                type: string
                description: Indicates part type, either an Integrated Circuit(IC) or Tool.
              htsCode:
                type: string
                description: Indicates if this part number has a harmonized tariff code.
              cooCode:
                type: string
                description: Indicate if this part number has certificate of conformance code.
              quantity:
                type: number
                description: The requested quantity specified while placing the order.
              shippedQuantity:
                type: number
                description: The quantity that was shipped.
              unitPrice:
                type: number
                format: double
                description: The Supplier unit price. You can find more details by visiting ti.com, going to the specific product page for this part number, and checking the pricing section.
              netPrice:
                type: number
                format: double
                description: The total net price of the product. This was calculated using unitPrice * quantity + fees(if any) - discounts offered(if any).
              dateCode:
                type: string
                description: Date code for Hirel parts.
              batchCode:
                type: string
                description: Batch code if available.
              status: 
                type: string
                description: Indicates the status of the line item. Possible values are 'Submitted' or 'Shipped'. This status can be different from the full order status. Due to system limitations, the status field may be absent or null for test orders.
              fees: 
                type: array
                items:
                  type: object
                  properties:
                    type: 
                      type: string
                      description: Indicates type for fees collected. For example - customer reel.
                    amount: 
                      type: number
                      format: double
                      description: Indicates fees calculated for the service offered. For example there is fees for custom reel.
              discounts: 
                type: array
                items:
                  type: object
                  properties:
                    type: 
                      type: string
                      description: Indicates the name of the discount that was applied. For example - custom reel discount.
                    amount: 
                      type: number
                      format: double
                      description: Indicates the amount for the discount that was applied.
              packageInformation: 
                type: object
                properties:
                  carrier: 
                    type: string
                    description: Indicates the package type used for example - Tape and Reel or Tube or Tray.
                  delivery:
                    type: array
                    items:
                      type: object
                      properties:
                        type: 
                          type: string
                          description: Indicates how is the packages delivered whether it is cut-type, full reel, custom reel.
                        quantity: 
                          type: number
                          description: Indicates the quantity that package will be delivered. How many pieces are in cut-tape, full reel, custom reel.
              waiverAvailable:
                type: string
                description: If this part has waiver available it will be "true" else it will be 'false'.
              trackingAndShipping:
                type: object
                properties:
                    trackingNumbers:
                      type: array
                      items:
                        type: object
                        properties:
                          shippingFreightAccount:
                            type: string
                            description: Indicates if we are using TI shipping freight or customer freight account. The possible values are "TI" or "Customer".
                          shippingFromCountryCode: 
                            type: string
                            description: The countrycode from this product will be shipped from.
                          serviceLevel: 
                            type: string
                            description: The service level used by the shipping carrier provider. This could be "International Economy" or " Priority Shipping". 
                          shipDate: 
                            type: string
                            description: The date when the items was shipped. Format for date is yyyy-MM-dd'T'HH:mm:ss'Z'.
                          leg1masterTrackingNumber:
                            type: string
                            description: The master tracking number for this line item if available.
                          leg1Carrier:
                            type: string
                            description: The name of the carrier that is used to ship the product. Example -  "Fedex" or "DHL".
                          leg1TrackingNumber:
                            type: string
                            description: The tracking number that was provided by the shipping carrier.
                          leg1TrackingUrl:
                            type: string
                            description: The tracking URL that was provided by the shipping carrier.
                          leg2masterTrackingNumber:
                            type: string
                            description: This is the master tracking number for this line item if available.
                          leg2Carrier:
                            type: string
                            description: The name of the carrier that is used to ship the product for the scenario where we have another carrier that is doing the second leg of shipment for cross-border shipments. Example - "Fedex" or "DHL"
                          leg2TrackingNumber:
                            type: string
                            description: The tracking number that was provided by the shipping carrier for the scenario where we have another carrier that is doing the second leg of shipment for cross-border shipments.
                          leg2TrackingUrl:
                            type: string
                            description: The tracking URL that was provided by the shipping carrier for the scenario where we have another carrier that is doing the second leg of shipment for cross-border shipments.
                          waybillNumber:
                            type: string
                            description: The waybill number for the shipment. Use this number to retrieve any shipment notifications via the API.
                    invoices:
                      type: array
                      items:
                        type: object
                        properties:
                          type: 
                            type: string
                            description: The type of invoice. This could be financial invoice or commercial invoice.
                          number: 
                            type: string
                            description: The invoice number that was generated. This number can be used for future reference.
                          message: 
                            type: string
                            description: If there are some special instructions the supplier has it will be mentioned here.
                    creditMemo:
                      type: object
                      properties:
                        note: 
                          type: string
                          description: Short description for the credit memo note available.
                        date: 
                          type: string
                          description: Date when the credit memo was created. Format for date is yyyy-MM-dd'T'HH:mm:ss'Z'.
                        multiShipFlag: 
                          type: boolean
                          description: Boolean value of true or false. If this is available it will true else it will be false.
              notifications:
                type: array
                items:
                  type: object
                  properties:
                    topic: 
                      type: string
                      description: The name of the category that this notification is applicable. For example - Shipping Method.
                    detail: 
                      type: string
                      description: Provides more details that is applicable to the order. For example if you shipping method option was not available, this notification will include the one what was used for shipping.
              customerItemComments: 
                type: array
                items:
                  type: object
                  properties:
                    message:
                      type: string
                      description: Customer pass-through text.
        shippingAddress: 
          type: object
          properties:
            firstName:
              type: string
              description: First name of the address.
            lastName:
              type: string
              description: Last name of the address.
            company:
              type: string
              description: Company name mentioned in the address.
            addressLine1:
              type: string
              description: Address line 1 of the address.
            addressLine2:
              type: string
              description: Address line 1 of the address.
            city:
              type: string
              description: Town or city of the address.
            stateRegion:
              type: string
              description: State or region of the address.
            postalCode:
              type: string
              description: Postal code of the address.     
            regionCode:
              type: string
              description: Two character ISO code of the country.
            region:
              type: string
              description: Country Name of the address.
            email:
              type: string
              description: Email address for the address.
            phoneNumber:
              type: string
              description: Phone number for the address.
            companyURL:
              type: string
              description: URL specified for the address.    
        billingAddress: 
          type: object
          properties:
            firstName:
              type: string
              description: First Name of the address.
            lastName:
              type: string
              description: Last Name of the address.
            company:
              type: string
              description: Company name mentioned in the address.
