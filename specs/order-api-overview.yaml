    get:
      tags:
        - TI store production order
      description: >-
        Retrieves order history for a specific data range.
      operationId: getOrderHistory
      security:
        - OAuth2: [] 
      parameters:
        - name: startDate
          in: query
          description: >-
            Start of date range for which to get order history. Limit to 1 year, or 10k records, whichever is less. Defaults to 30 days ago.
          required: false
          schema:
            type: string
          example: '2022-08-01'
        - name: endDate
          in: query
          description: >-
            End of date range for which to get order history. Limit to 1 year, or 10k records, whichever is less. Defaults to today.
          required: false
          schema:
            type: string
          example: '2022-09-01'
      responses:
        '200':
          description: Order list retrieved.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/orderSummary'
        '400':
          description: 400 Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errors'
              example:
                errors:
