              schema:
                $ref: '#/components/schemas/errors'
              example: 
                errors:
                - errorCode: TI-API-00429
                  type: Security
                  reason: Too many requests
                  message: Rate Limit Quota Hit.
        '500':
          description: System error.  The response should contain error details, including Execution ID, with which TI API support team can investigate.
          content:
