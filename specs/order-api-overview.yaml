  /store/orders/deliveryCost:
    parameters:
      - name: regionCode
        in: query
        description: >- 
          Denotes the 2 character alphabet - ISO code. Example : US
        required: true
        schema:
          type: string
          example: 'country'    
      - name: currencyCode
        in: query
        description: >- 
            Denotes the 3 character alphabet ISO currency code. Example : USD
        required: true
        schema:
          type: string
          example: 'currency'   
      - name: quantity
        in: query
        description: >- 
            Denotes the quantity. This should be a number greater than zero
        required: true
        schema:
          type: number
          example: 'quantity' 
    get:
      tags:
        - TI store production order
      description: Get estimated delivery costs. 
      security:
