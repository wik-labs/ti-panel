openapi: 3.0.3
info:
  title: TI store order APIs
  description: TI store order APIs enable authorized customers to systematically create and retrieve store orders. See the full list of <a href="https://e2e.ti.com/search?q=error order&category=forum&group=453_452&faq=true&sort=date%20asc">error codes and detail descriptions</a>.
  version: 2.0.0
  contact:
    name: API Support
    url: https://www.ti.com/developer-api/support.html
servers:
  - url: 'https://transact.ti.com/v2'
    description: External Production API Gateway

security:
  - OAuth2: []
 
paths:
  /store/orders/test:
    post:
      tags:
        - TI store test order
      description: Create a TI store test order.
      security:
        - OAuth2: [] 
      requestBody:
        description: 'TI store Test Order Create Request'
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/orderCreate'
            example:
              order:
                checkoutProfileId: "INSERT CHECKOUT PROFILE ID HERE"
                customerPurchaseOrderNumber: "INSERT PO NUMBER HERE"
                endCustomerCompanyName: "INSERT END CUSTOMER NAME HERE"
                expediteShipping: false
                customerOrderComments:
                  - message: "MY TEST ORDER"
                lineItems:
                  - customerLineItemNumber: 1
                    tiPartNumber: "NE555DR"
                    customerPartNumber: "MY CUSTOMER PARTNUMBER"
                    customReelIndicator: false
                    quantity: 1
                    customerItemComments:
                      - message: "SOME COMMENT GOES HERE"
                  - customerLineItemNumber: 2
                    tiPartNumber: "LM358PWR"
                    quantity: 1              
      responses:
        '201':
          description: Order created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/orderCreateResponse'
              example: 
                orderInfo:
                  orderNumber: "T10000000"
                  cartId: "C10000000"
                  checkoutProfileId: "COP_ID-1234"
                  currencyCode: "USD"
                  orderDate: "2020-12-31T13:56:00Z"
                  orderEntry: "API"
                  customerPurchaseOrderNumber: "PGR - 04202021"
                  orderStatus: "Submitted"
                  orderedBy: "TI Electronics Inc"
                  endCustomerCompanyName: "TI Electronics Inc"
                  application: "Gaming"
                  endEquipment: "Gaming controller & peripherals"
                  intendedForMilitary: false
