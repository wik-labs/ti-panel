                    section: Generic
                    type: BadRequest
                    reason: Invalid Syntax in request JSON
                    message: There is an error in the syntax. Please correct the syntax (i.e extra comma, missing comma, missing bracket, etc.) and try again.                    
        '401':
          description: 401 API Token invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errors'
              example:
                errors:
                  - errorCode: TI-API-00401
                    type: Security
                    reason: Invalid Credentials
                    message: Provide a valid Bearer token
        '404':
          description: 404 API Endpoint not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errors'
              example:
                errors:
                  - errorCode: TI-API-00404
                    type: ResourceNotFound
                    section: Path
                    reason: Resource could not be found
                    message: Order not found for 'DOESNOTEXIST'
        '429':
          description: 429 Quota Limit Hit
        '503':
          description: >-
            503 System error.  The response should contain error details,
            including Execution ID, with which TI API support team can
            investigate.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errors'
              example:
                error:
                  - errorCode: TI-API-00503
                    type: Unknow
                    reason: Service unavailable
                    message: >-
                      This service is temporarily unavailable. Please contact
                      support
